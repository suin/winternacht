# Winternacht Dark theme configuration
# All colors reference @winternacht_color_* variables defined in winternacht.tmux

# Separator icons (Nerd Font)
set -g @winternacht_left_sep ""
set -g @winternacht_right_sep ""
set -g @winternacht_session_icon ""

# Status bar
set -g status-style "bg=default,fg=#{@winternacht_color_text}"
set -g status-left-length 40
set -g status-right-length 100
set -g status-left ""
# Session name (clay when prefix is pressed, lavender otherwise)
set -g status-right "#[fg=#{?client_prefix,#{@winternacht_color_clay},#{@winternacht_color_lavender}}]#{@winternacht_left_sep}#[fg=#{@winternacht_color_bg_surface},bg=#{?client_prefix,#{@winternacht_color_clay},#{@winternacht_color_lavender}}]#{@winternacht_session_icon} #[fg=#{@winternacht_color_text},bg=#{@winternacht_color_bg_surface}] #S#[fg=#{@winternacht_color_bg_surface}]#{@winternacht_right_sep} "

# Window tabs (rounded)
set -g window-status-format "#[fg=#{@winternacht_color_muted}]#{@winternacht_left_sep}#[fg=#{@winternacht_color_bg},bg=#{@winternacht_color_muted}]#I #[fg=#{@winternacht_color_text},bg=#{@winternacht_color_bg_surface}] #W#[fg=#{@winternacht_color_bg_surface},bg=default]#{@winternacht_right_sep}"
set -g window-status-current-format "#[fg=#{@winternacht_color_accent_deep}]#{@winternacht_left_sep}#[fg=#{@winternacht_color_bg},bg=#{@winternacht_color_accent_deep}]#I #[fg=#{@winternacht_color_text},bg=#{@winternacht_color_bg_elevated}] #W#[fg=#{@winternacht_color_bg_elevated},bg=default]#{@winternacht_right_sep}"
set -g window-status-activity-style "bg=#{@winternacht_color_accent},fg=#{@winternacht_color_bg}"
set -g window-status-bell-style "bg=#{@winternacht_color_sand},fg=#{@winternacht_color_bg}"

# Pane borders
set -g pane-border-style "fg=#{@winternacht_color_border}"
set -g pane-active-border-style "#{?pane_in_mode,fg=#{@winternacht_color_accent},#{?pane_synchronized,fg=#{@winternacht_color_accent_deep},fg=#{@winternacht_color_accent}}}"

# Messages
set -g message-style "fg=#{@winternacht_color_accent},bg=default,align=centre"
set -g message-command-style "fg=#{@winternacht_color_accent},bg=default,align=centre"

# Menu
set -g menu-selected-style "fg=#{@winternacht_color_text},bold,bg=#{@winternacht_color_border}"

# Popup
set -g popup-style "bg=#{@winternacht_color_bg},fg=#{@winternacht_color_text}"
set -g popup-border-style "fg=#{@winternacht_color_bg_elevated}"

# Copy mode / Clock
set -g mode-style "bg=#{@winternacht_color_bg_surface},bold"
set -g clock-mode-colour "#8CC3CB"
